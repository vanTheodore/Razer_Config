name: Windows Rust CI and Releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 tests + release binaries
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Tests (also checks both executables)
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release --bins
      - name: Package portable binaries and hashes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/cloncontrol.exe dist/
          Copy-Item target/release/a704f-diag.exe dist/
          $hashLines = foreach ($file in (Get-ChildItem dist/*.exe)) {
            "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($file.Name)"
          }
          $hashLines | Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8
          Compress-Archive -Path dist/*.exe -DestinationPath dist/ClonControl-Windows-x64.zip
      - name: Keep downloadable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloncontrol-windows-x64
          path: |
            dist/ClonControl-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish after successful Windows build
    needs: windows
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested binaries
        uses: actions/download-artifact@v4
        with:
          name: cloncontrol-windows-x64
          path: release
      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Release tested portable zip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          IS_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          printf '%s\n'             'CLON//CONTROL experimental, Rust, Windows x64.'             ''             'Binaries passed cargo test and cargo build on a Windows runner.'             'Not tested against real A704F hardware. Does not update firmware.'             'First run a704f-diag.exe (read-only); keep simulation enabled in the GUI.'             > release-notes.md
          EXTRA=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then EXTRA+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/ClonControl-Windows-x64.zip release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "CLON//CONTROL $RELEASE_TAG" \
            --notes-file release-notes.md "${EXTRA[@]}"
