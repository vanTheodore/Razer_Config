[package]
name = "cloncontrol-a704f"
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
description = "Experimental Windows configurator for HID mouse 18F8:1286 / Instant A704F"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.33.2", default-features = false, features = ["default_fonts", "glow"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[[bin]]
name = "cloncontrol"
path = "src/main.rs"

[[bin]]
name = "a704f-diag"
path = "src/bin/a704f-diag.rs"
