[package]
name = "cloncontrol-a704f"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "CLON//CONTROL: DPI configurator for Instant A704F 18F8:1286 mouse"
license = "MIT"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }

[build-dependencies]
winresource = "=0.1.34"

[[bin]]
name = "cloncontrol"
path = "src/main.rs"

[[bin]]
name = "a704f-diag"
path = "src/bin/a704f-diag.rs"

[[bin]]
name = "a704f-trace"
path = "src/bin/a704f-trace.rs"
